<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>405 - Method Not Allowed</title>
<style>
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-color: #111827;
    color: #f8fafc;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
  }
  .container {
    text-align: center;
  }
  h1 {
    font-size: 8rem;
    margin: 0;
    color: #fbbf24;
  }
  h2 {
    font-size: 2rem;
    margin: 10px 0;
  }
  p {
    margin: 20px 0;
    color: #9ca3af;
  }
  a {
    text-decoration: none;
    color: #10b981;
    font-weight: bold;
    background: #1f2937;
    padding: 10px 20px;
    border-radius: 6px;
    transition: 0.3s;
  }
  a:hover {
    background: #374151;
  }
</style>
</head>
<body>
  <div class="container">
    <h1>405</h1>
    <h2>Method Not Allowed</h2>
    <p>The request method used is not supported for this route.</p>
    <a href="/admin">Return to Dashboard</a>
  </div>
</body>
</html>
