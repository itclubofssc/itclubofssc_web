<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>500 - Internal Server Error</title>
<style>
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-color: #1e293b;
    color: #f8fafc;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
  }
  .container {
    text-align: center;
  }
  h1 {
    font-size: 8rem;
    margin: 0;
    color: #f87171;
  }
  h2 {
    font-size: 2rem;
    margin: 10px 0;
  }
  p {
    margin: 20px 0;
    color: #9ca3af;
  }
  a {
    text-decoration: none;
    color: #3b82f6;
    font-weight: bold;
    background: #111827;
    padding: 10px 20px;
    border-radius: 6px;
    transition: 0.3s;
  }
  a:hover {
    background: #1f2937;
  }
</style>
</head>
<body>
  <div class="container">
    <h1>500</h1>
    <h2>Internal Server Error</h2>
    <p>Something went wrong on the server. Try again later or contact support.</p>
    <a href="/admin">Go Back to Dashboard</a>
  </div>
</body>
</html>
